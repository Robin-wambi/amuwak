name: amuwak_workspace
description: >-
  Workspace root for Amuwak: the staff app, the customer app, and the
  amuwak_core package they share. Not an application itself — it exists to
  pin ONE resolution (a single pubspec.lock) across all three, so a shared
  dependency can never drift between them.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.8.0

# Every package in the repo. `flutter pub get` here resolves all of them
# together; each member declares `resolution: workspace`.
workspace:
  - packages/amuwak_core
  - apps/amuwak_staff
  - apps/amuwak_customer

dev_dependencies:
  # Workspace tooling: `melos run analyze` / `melos run test` fan out across
  # the members (see melos.yaml). Lives here rather than in an app because it
  # operates on the repo, not on any one package.
  melos: ^6.3.0
