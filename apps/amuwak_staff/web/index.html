<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    Invite and password-recovery links arrive as ?code=<one-time code> in the
    URL (see AuthGate), and any third-party resource this page requests would
    otherwise receive that code in its Referer header — a live account-takeover
    token. The customer app sends this as a real response header via Cloudflare
    Pages' _headers; this app deploys to GitHub Pages, which ignores that file,
    so the meta tag is the only mechanism available here. Nothing in this app
    depends on the referrer being sent.
  -->
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="On-the-road tool for Amuwak laundry pickup and delivery riders.">

  <!-- iOS PWA support -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Amuwak">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Amuwak Staff</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
