<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    A password recovery link arrives as ?code=<one-time code> in the URL, and
    any third-party resource this page requests would otherwise receive that
    code in its Referer header. web/_headers sends the same policy as a real
    response header, which is stronger; this tag is the belt to that braces and
    keeps the protection if the app is ever served from a host that does not
    read _headers. Nothing here depends on the referrer being sent.
  -->
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Book a laundry pickup, track it live, and chat with the shop.">
  <meta name="theme-color" content="#A85A1F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Amuwak">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Amuwak</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
