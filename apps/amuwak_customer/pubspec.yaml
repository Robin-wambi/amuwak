name: amuwak_customer
description: "Amuwak — customer app (self-service pickups, tracking, chat)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  amuwak_core:
    path: ../../packages/amuwak_core

  cupertino_icons: ^1.0.8

  # State + routing + backend
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  supabase_flutter: ^2.5.0
  # Direct dep so we can pass a timeout-wrapping Client to Supabase.initialize
  # (mirrors the staff app's poor-network resilience).
  http: ^1.2.0

  # Offline foundation (targeted resilience): a local Drift DB is the cart's
  # source of truth + an outbox queues writes (checkout, cart mirror, photo
  # upload) to drain when connectivity returns. Mirrors the staff app's stack.
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0
  connectivity_plus: ^6.0.0

  # Damage photos on a cart line. Same capture + compress params as the staff
  # proof photos (1280px longest edge, JPEG 80); the compressed bytes are held
  # in the local DB (not a file) so the path works on web too.
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  drift_dev: ^2.18.0
  build_runner: ^2.4.0
  # Builds a v1-schema file so the schema migration can be tested for real.
  sqlite3: ^2.4.0

flutter:
  uses-material-design: true

  # Brand typeface, bundled (not fetched) so it renders offline. Plus Jakarta
  # Sans, OFL — see assets/fonts/OFL.txt. Same family the staff app uses so
  # buildAmuwakTheme() (amuwak_core) renders identically.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
