name: amuwak

packages:
  # The repo root is a workspace root, not a package with code, so it is no
  # longer listed here — the staff app lives in apps/amuwak_staff alongside
  # the customer app.
  - packages/**
  - apps/**

scripts:
  analyze:
    description: Analyze all packages.
    run: flutter analyze
    exec:
      concurrency: 1
  test:
    description: Run tests in packages that have a test/ dir.
    run: flutter test
    exec:
      concurrency: 1
    packageFilters:
      dirExists: test
